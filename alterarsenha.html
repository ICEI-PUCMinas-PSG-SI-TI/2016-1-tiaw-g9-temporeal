<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="pagina-simples">
    <a href="perfil.html" class="voltar">
        <i class="fa-solid fa-arrow-left"></i> Voltar
    </a>

    <div class="card">
        <h2>Alterar Senha</h2>

        <form id="formSenha" novalidate>
            <label for="senhaAtual">Senha atual</label>
            <div class="campo-senha">
                <input type="password" id="senhaAtual" required>
                <button type="button" class="olho" data-alvo="senhaAtual">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <label for="novaSenha">Nova senha</label>
            <div class="campo-senha">
                <input type="password" id="novaSenha" required>
                <button type="button" class="olho" data-alvo="novaSenha">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <label for="confirmarSenha">Confirmar nova senha</label>
            <div class="campo-senha">
                <input type="password" id="confirmarSenha" required>
                <button type="button" class="olho" data-alvo="confirmarSenha">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <p class="dica">
                A nova senha deve ter pelo menos 8 caracteres, uma letra maiúscula e um número.
            </p>

            <button type="submit" id="atualizarSenha" class="btn-principal">
                Atualizar senha
            </button>
        </form>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="senha.js"></script>

</body>
</html>
