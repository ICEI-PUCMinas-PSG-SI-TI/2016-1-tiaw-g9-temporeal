<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tarefas - Tempo Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tarefas.css">
</head>
<body class="bg-light">

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-white border-end shadow-sm p-4"
         style="width: 250px; min-height: 100vh;">

        <h2 class="text-primary mb-5">
            <i class="bi bi-phone"></i>
            Tempo Real
        </h2>

        <ul class="nav flex-column">

            <li class="nav-item mb-3">
                <a href="home.html" class="nav-link text-dark">
                    <i class="bi bi-house"></i>
                    Início
                </a>
            </li>

            <li class="nav-item mb-3">
                <a href="monitoramento.html" class="nav-link text-dark">
                    <i class="bi bi-bar-chart"></i>
                    Monitoramento
                </a>
            </li>

            <li class="nav-item mb-3">
                <a href="tarefas.html" class="nav-link active bg-primary text-white rounded">
                    <i class="bi bi-check-square"></i>
                    Tarefas
                </a>
            </li>

            <li class="nav-item mb-3">
                <a href="cronometro.html" class="nav-link text-dark">
                    <i class="bi bi-stopwatch"></i>
                    Cronômetro
                </a>
            </li>
            <li class="nav-item mb-3">
                <a href="alertas.html" class="nav-link text-dark">
                    <i class="bi bi-bell"></i>
                    Alertas
                </a>
            </li>

        </ul>

        <div class="mt-4">
            <hr>
            <button class="btn btn-outline-danger w-100" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i>
                Sair
            </button>
        </div>

    </div>

    <!-- Main content -->
    <div class="flex-grow-1 p-4">

        <h2 class="mb-4">Minhas Tarefas</h2>

        <div class="card p-4 shadow-sm mb-4">
            <form id="form-tarefa">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="text" id="titulo" class="form-control" placeholder="Título" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" id="descricao" class="form-control" placeholder="Descrição">
                    </div>
                    <div class="col-md-4">
                        <select id="tipo" class="form-select">
                            <option value="tarefa">Tarefa</option>
                            <option value="prova">Prova</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="date" id="data" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100">Adicionar tarefa</button>
                    </div>
                </div>
            </form>
        </div>

        <ul id="lista-tarefas" class="list-unstyled"></ul>

    </div>

</div>

<script src="js/tarefas.js"></script>
<script src="js/script.js"></script>
</body>
</html>
