rel="stylesheet">

rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>



<body>

  <i class="bi bi-phone"></i>

  <span>

</div>

<main class="content">





<header>


<h1>
Monitoramento dos Alunos 📊
</h1>


<p>
Acompanhe notas e frequência da turma.
</p>


</header>








<section class="cards">





<div class="card-dashboard">

<h5>
👥 Total de alunos
</h5>


<h2 id="totalAlunos">
0
</h2>


</div>







<div class="card-dashboard">

<h5>
📊 Média da turma
</h5>


<h2 id="mediaTurma">
0
</h2>


</div>







<div class="card-dashboard">

<h5>
📅 Frequência média
</h5>


<h2 id="frequenciaMedia">
0%
</h2>


</div>







<div class="card-dashboard">

<h5>
⚠ Em atenção
</h5>


<h2 id="alunosAtencao">
0
</h2>


</div>





</section>










<section class="grafico-card">



<h4>
Adicionar Novo Aluno
</h4>



<div class="row mt-4">



<div class="col-md-4">

<input

type="text"

id="nomeAluno"

class="form-control"

placeholder="Nome do aluno"

>

</div>





<div class="col-md-2">

<input

type="number"

id="notaAluno"

class="form-control"

placeholder="Nota"

>

</div>





<div class="col-md-2">

<input

type="number"

id="freqAluno"

class="form-control"

placeholder="Frequência"

>

</div>





<div class="col-md-2">


<button

class="btn btn-success"

onclick="adicionarAluno()"

>

➕ Adicionar

</button>


</div>



</div>









<h4 class="mt-5">

Desempenho dos alunos

</h4>






<table class="table table-hover mt-3">


<thead>


<tr>

<th>
Aluno
</th>


<th>
Nota
</th>


<th>
Frequência
</th>


<th>
Status
</th>


<th>
Ação
</th>


</tr>


</thead>



<tbody id="listaAlunos">


</tbody>



</table>





</section>







</main>





<script src="js/monitoramento-professor.js"></script>


</body>


</html>
