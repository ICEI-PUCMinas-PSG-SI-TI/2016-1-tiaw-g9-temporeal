<!DOCTYPE html>
<html lang="pt-BR">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Excluir Conta</title>
     <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
     <link rel="stylesheet"
           href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="pagina-simples">
    <a href="perfil.html" class="voltar">
        <i class="fa-solid fa-arrow-left"></i> Voltar
    </a>

    <div class="card">
        <h2>Excluir Conta</h2>

        <div class="aviso">
            <strong><i class="fa-solid fa-triangle-exclamation"></i> Atenção</strong>
            <p>Esta ação removerá todos os dados armazenados no navegador.</p>
            <p>A exclusão é permanente e não poderá ser desfeita.</p>
        </div>

        <form id="formExcluir" novalidate>
            <label for="senhaExcluir">Digite sua senha para confirmar</label>
            <input type="password" id="senhaExcluir" required>

            <button type="submit" id="btnExcluir" class="btn-danger">
                Excluir conta
            </button>
        </form>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="excluir.js"></script>

</body>
</html>
